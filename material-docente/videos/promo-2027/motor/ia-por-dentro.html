<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>La IA por dentro</title>
    <style>
        html, body { margin: 0; background: #07060f; }
        motor-escena { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <!-- Escena del video de promoción 2027: un pedido se parte en tokens, la atención une los que
         importan y la respuesta sale de a poco. Dura 20 golpes. Se graba con el video.js del motor. -->
    <motor-escena escena="ia-por-dentro" estilo="neon" video></motor-escena>

    <script src="motor.min.js"></script>
    <script src="golpe.js"></script>
    <script>
        const { caja, texto, flecha } = Motor;

        // Los tokens del pedido: [id, texto, fila]. Como en los modelos de verdad, las palabras largas o
        // poco comunes se parten en pedazos ("Hace|me", "cat|á|logo", "paste|le|ría"); las cortas van enteras.
        // Los pedazos de una misma palabra van pegaditos; entre palabras queda más aire.
        const TOKENS = [
            ['k1', 'Hace', 0], ['k2', 'me', 0, true], ['k3', 'un', 0], ['k4', 'cat', 0], ['k5', 'á', 0, true], ['k6', 'logo', 0, true],
            ['k7', 'para', 1], ['k8', 'mi', 1], ['k9', 'paste', 1], ['k10', 'le', 1, true], ['k11', 'ría', 1, true],
        ];
        const FILAS = [860, 1130];
        const COLORES = ['acento', 'acento2', 'exito', 'alerta', 'acento', 'acento2', 'exito', 'alerta', 'acento', 'acento2', 'exito'];
        const ancho = (palabra) => palabra.length * 30 + 66;
        // Las x de cada token: centrados por fila, 8 de separación dentro de una palabra y 26 entre palabras
        const xs = {};
        [0, 1].forEach((fila) => {
            const deLaFila = TOKENS.filter((tk) => tk[2] === fila);
            const huecos = deLaFila.map((tk, i) => (i === 0 ? 0 : (tk[3] ? 8 : 26)));
            const total = deLaFila.reduce((s, tk, i) => s + ancho(tk[1]) + huecos[i], 0);
            let x = 540 - total / 2;
            deLaFila.forEach((tk, i) => { x += huecos[i]; xs[tk[0]] = x + ancho(tk[1]) / 2; x += ancho(tk[1]); });
        });

        const piezas = {
            pedido: caja({
                x: 540, y: 680, ancho: 980, alto: 160, radio: 80, texto: 'Haceme un catálogo para mi pastelería',
                tamano: 40, peso: 700, borde: 'acento', grosorBorde: 4, escrito: 0, opacidad: 0,
            }),
            rotTokens: texto({ x: 540, y: 1265, texto: 'tokens', tamano: 50, peso: 700, color: 'suave', opacidad: 0, fuente: 'mono' }),
            rotAtencion: texto({ x: 540, y: 1265, texto: 'atención', tamano: 50, peso: 700, color: 'acento2', opacidad: 0, fuente: 'mono' }),
            respuesta: caja({
                x: 540, y: 1460, ancho: 980, alto: 240, radio: 28, relleno: 'papel', borde: 'exito', grosorBorde: 4,
                texto: '¡Dale! Tu catálogo:\n🍰 Tortas · 🧁 Cupcakes · 🍪 Cookies', tamano: 50, peso: 800,
                escrito: 0, opacidad: 0, escala: 0.9,
            }),
        };
        TOKENS.forEach(([id, palabra, fila], i) => {
            piezas[id] = caja({
                x: xs[id], y: FILAS[fila], ancho: ancho(palabra), alto: 120, radio: 22, texto: palabra,
                tamano: 52, peso: 800, color: COLORES[i], borde: COLORES[i], grosorBorde: 4, opacidad: 0, escala: 0.4,
            });
        });
        // Para la atención, los pedazos se juntan de nuevo en sus palabras: así las flechas van entre
        // palabras que se entienden ("pastelería" mira a "catálogo"), no entre pedazos sueltos.
        const PALABRAS = [
            ['w1', 'Haceme', ['k1', 'k2'], 0, 'acento'],
            ['w2', 'catálogo', ['k4', 'k5', 'k6'], 0, 'exito'],
            ['w3', 'pastelería', ['k9', 'k10', 'k11'], 1, 'acento2'],
        ];
        const anchoDe = Object.fromEntries(TOKENS.map(([id, palabra]) => [id, ancho(palabra)]));
        const centroDe = {};
        PALABRAS.forEach(([id, palabra, partes, fila, color]) => {
            const izq = xs[partes[0]] - anchoDe[partes[0]] / 2;
            const der = xs[partes[partes.length - 1]] + anchoDe[partes[partes.length - 1]] / 2;
            centroDe[id] = (izq + der) / 2;
            piezas[id] = caja({
                x: centroDe[id], y: FILAS[fila], ancho: der - izq, alto: 120, radio: 22, texto: palabra,
                tamano: 52, peso: 800, color, borde: color, grosorBorde: 5, opacidad: 0, escala: 0.6,
            });
        });
        // La atención: desde "pastelería" hacia las palabras que le dan sentido
        [['a1', 'w2', 0.35], ['a2', 'w1', -0.3], ['a3', 'k8', 0.9]].forEach(([id, hasta, curvatura]) => {
            piezas[id] = flecha({ desde: 'w3', hasta, curvatura, grosor: 6, color: 'acento2', progreso: 0 });
        });

        // 20 golpes (a 120 BPM, 10 s). Cada momento tiene tiempo para leerse.
        const linea = [
            // Cada momento cae con su frase de la voz (27/11): ver acomodar en armar-version.py.
            // El pedido se escribe solo mientras dice "vas a entender cómo funciona por dentro"
            { pieza: 'pedido', a: { opacidad: 1 }, dur: 0.15, en: 0, sonido: 'whoosh' },
            { pieza: 'pedido', a: { escrito: 1 }, dur: 2.4, curva: 'lineal', en: 0.1 },
            // Se parte en tokens, uno tras otro: "cómo parte lo que le pedís en pedacitos"
            ...TOKENS.map(([id], i) => (
                { pieza: id, a: { opacidad: 1, escala: 1 }, dur: 0.3, curva: 'resorte', en: 3.6 + i * 0.18, sonido: 'pop', tono: i }
            )),
            { pieza: 'pedido', a: { opacidad: 0.25 }, dur: 0.4, en: 3.6 },
            { pieza: 'rotTokens', a: { opacidad: 1 }, dur: 0.2, en: 3.7 },
            // Los pedazos se juntan en sus palabras
            ...PALABRAS.flatMap(([id, , partes]) => [
                ...partes.map((parte) => ({ pieza: parte, a: { x: centroDe[id], opacidad: 0, escala: 0.8 }, dur: 0.3, curva: 'entrar', en: 5.85 })),
                { pieza: id, a: { opacidad: 1, escala: 1 }, dur: 0.35, curva: 'resorte', en: 6.0 },
            ]),
            { sonido: 'pop', en: 6.0 },
            // La atención: "en qué se fija"
            { pieza: 'rotTokens', a: { opacidad: 0 }, dur: 0.15, en: 6.3 },
            { pieza: 'rotAtencion', a: { opacidad: 1 }, dur: 0.2, en: 6.3 },
            { pieza: 'a1', a: { progreso: 1 }, dur: 0.4, curva: 'salir', en: 6.35, sonido: 'whoosh' },
            { pieza: 'w2', a: { resaltado: 1 }, dur: 0.25, en: 6.7 },
            { pieza: 'a2', a: { progreso: 1 }, dur: 0.4, curva: 'salir', en: 6.85 },
            { pieza: 'w1', a: { resaltado: 1 }, dur: 0.25, en: 7.2 },
            { pieza: 'a3', a: { progreso: 1 }, dur: 0.4, curva: 'salir', en: 7.35 },
            { pieza: 'k8', a: { resaltado: 1 }, dur: 0.25, en: 7.7 },
            // La respuesta, de a poco: "y cómo arma la respuesta"
            { pieza: 'respuesta', a: { opacidad: 1, escala: 1 }, dur: 0.3, curva: 'resorte', en: 7.95, sonido: 'pop' },
            { pieza: 'respuesta', a: { escrito: 1 }, dur: 1.9, curva: 'lineal', en: 8.15 },
            { pieza: 'respuesta', a: { resaltado: 1 }, dur: 0.3, en: 10.05, sonido: 'ding' },
            { espera: 0.6 },
        ];

        Motor.registrar('ia-por-dentro', { titulo: 'La IA por dentro', ancho: 1080, alto: 1920, piezas, linea: alTempo(linea) });
    </script>
</body>
</html>
