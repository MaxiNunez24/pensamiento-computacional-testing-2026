<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>De etiquetas a página</title>
    <style>
        html, body { margin: 0; background: #07060f; }
        motor-escena { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <!-- Escena del video de promoción 2027: las etiquetas <h1>, <p> e <img> caen dentro de un
         celular y se vuelven una página con productos, que se publica. Dura 24 golpes. -->
    <motor-escena escena="web" estilo="neon" video></motor-escena>

    <script src="motor.min.js"></script>
    <script src="golpe.js"></script>
    <script>
        const { caja, texto, celular } = Motor;

        // Las etiquetas: cada una baja, se queda arriba un momento con lo que hace (para leerla) y recién
        // ahí cae dentro del celular: [id, texto, qué hace, color]
        const ETIQUETAS = [['t1', '<h1>', 'el título', 'acento'], ['t2', '<p>', 'un texto', 'acento2'], ['t3', '<img>', 'una foto', 'exito']];
        // Los productos, adentro de la pantalla del celular (que siempre mide 360 × 740)
        const PRODUCTOS = [
            ['p1', '🍰', 'Tortas', 95, 395], ['p2', '🧁', 'Cupcakes', 265, 395],
            ['p3', '🍪', 'Cookies', 95, 575], ['p4', '🍩', 'Donas', 265, 575],
        ];

        const piezas = {
            cel: celular({ x: 540, y: 1010, alto: 900, escala: 0 }),
            url: caja({
                dentro: 'cel', x: 180, y: 70, ancho: 330, alto: 40, radio: 20, relleno: 'fondo', borde: 'borde', grosorBorde: 2,
                texto: '🔒 tuemprendimiento.github.io', tamano: 15, peso: 600, color: 'suave', escrito: 0,
            }),
            h1: texto({ dentro: 'cel', x: 180, y: 160, texto: 'Tu emprendimiento', tamano: 34, peso: 900, color: 'acento', opacidad: 0, escala: 1.6 }),
            p: texto({ dentro: 'cel', x: 180, y: 215, texto: 'Hecho en Ensenada · pedí por WhatsApp', tamano: 16, peso: 600, color: 'suave', opacidad: 0, escrito: 0 }),
            publicada: caja({
                x: 540, y: 1530, ancho: 520, alto: 110, radio: 55, relleno: 'exito', borde: 'exito',
                texto: '✓ Publicada', tamano: 52, peso: 900, color: 'fondo', escala: 0,
            }),
        };
        ETIQUETAS.forEach(([id, etiqueta, que, color]) => {
            piezas[id] = caja({
                x: 540, y: -200, ancho: 300, alto: 140, radio: 22, texto: etiqueta, tamano: 76, peso: 800,
                color, borde: color, grosorBorde: 6,
            });
            piezas[id + 'q'] = texto({ x: 540, y: 520, texto: que, tamano: 54, peso: 700, color: 'texto', opacidad: 0 });
        });
        PRODUCTOS.forEach(([id, icono, nombre, x, y]) => {
            piezas[id] = caja({
                dentro: 'cel', x, y, ancho: 150, alto: 160, radio: 18, relleno: 'papel', borde: 'marco', grosorBorde: 2,
                icono, tamanoIcono: 60, texto: nombre, tamano: 20, peso: 800, escala: 0,
            });
        });

        // 24 golpes (a 120 BPM, 12 s), sin apuro: cada etiqueta tiene su tiempo para leerse
        const linea = [
            // Entra el celular, vacío (golpe 0)
            { pieza: 'cel', a: { escala: 1 }, dur: 0.4, curva: 'resorte', en: 0, sonido: 'whoosh' },
            // Cada etiqueta: baja (golpes 1, 4 y 7), se queda dos golpes y cae al celular (golpes 3, 6 y 9)
            ...ETIQUETAS.flatMap(([id], i) => {
                const baja = 0.5 + i * 1.5;
                const cae = baja + 1.0;
                return [
                    { pieza: id, a: { y: 380 }, dur: 0.35, curva: 'pasarse', en: baja, sonido: 'whoosh' },
                    { pieza: id + 'q', a: { opacidad: 1 }, dur: 0.25, en: baja + 0.2 },
                    { pieza: id + 'q', a: { opacidad: 0 }, dur: 0.15, en: cae },
                    { pieza: id, a: { y: 760, escala: 0.75 }, dur: 0.35, curva: 'entrar', en: cae },
                    { pieza: id, a: { escala: 1.2, opacidad: 0 }, dur: 0.15, curva: 'salir', en: cae + 0.35, sonido: 'golpe' },
                ];
            }),
            // Lo que hace cada una aparece en la página
            { pieza: 'h1', a: { opacidad: 1, escala: 1 }, dur: 0.3, curva: 'resorte', en: 1.85 },
            { pieza: 'p', a: { opacidad: 1 }, dur: 0.1, en: 3.35 },
            { pieza: 'p', a: { escrito: 1 }, dur: 0.8, curva: 'lineal', en: 3.35 },
            ...PRODUCTOS.map(([id], i) => (
                { pieza: id, a: { escala: 1 }, dur: 0.3, curva: 'resorte', en: 4.85 + i * 0.25, sonido: 'pop', tono: i * 2 }
            )),
            // La dirección se escribe (golpes 12 a 14) y se publica (golpe 16)
            // (27/11: un golpe antes, para que el "✓ Publicada" caiga cuando la voz dice "las publicás")
            { pieza: 'url', a: { escrito: 1 }, dur: 0.8, curva: 'lineal', en: 5.6, sonido: 'clic' },
            { pieza: 'url', a: { resaltado: 1 }, dur: 0.3, en: 6.4 },
            { pieza: 'publicada', a: { escala: 1 }, dur: 0.4, curva: 'resorte', en: 7.0, sonido: 'exito' },
            { pieza: 'cel', a: { escala: 1.04 }, dur: 0.1, curva: 'salir', en: 7.0 },
            { pieza: 'cel', a: { escala: 1 }, dur: 0.4, curva: 'gelatina', en: 7.1 },
            { espera: 5.6 },
        ];

        Motor.registrar('web', { titulo: 'De etiquetas a página', ancho: 1080, alto: 1920, piezas, linea: alTempo(linea) });
    </script>
</body>
</html>
