<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merienda</title>
  <style>
    /* El navegador del que abra esto puede estar en modo oscuro. Si el body no
       declara fondo, queda transparente: el navegador pinta su canvas oscuro y
       este texto negro encima no se lee. `color-scheme: light` le avisa que la
       página es clara; el fondo y el color explícitos son el cinturón además
       de los tirantes. Una pantalla que se proyecta tiene que verse igual en
       cualquier máquina. */
    :root { color-scheme: light; }
    body { font-family: system-ui, sans-serif; text-align: center; padding-top: 12vh;
           background: #fff; color: #111; }
    .n { font-size: 22vw; font-weight: bold; line-height: 1; }
    p { font-size: 20px; color: #555; }
  </style>
</head>
<body>
  <p>Hoy en el CFP</p>
  <div class="n">{{ cuantos }}</div>
  <p>alumnos presentes</p>
</body>
</html>
