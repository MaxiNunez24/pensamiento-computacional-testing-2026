site_name: Pensamiento Computacional y Testing de Aplicaciones 2026
site_url: https://maxinunez24.github.io/pensamiento-computacional-testing-2026/
site_author: Maximiliano Nuñez

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/clases-restantes.js

theme:
  name: material
  favicon: assets/images/favicon.ico
  logo: assets/images/favicon.ico
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

  features:
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: 
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets



plugins:
  # ⚠️ Al declarar `plugins:` se desactiva el buscador, que hasta acá venía
  # implícito. Por eso `search` va listado a mano: sin esta línea el sitio se
  # publica sin buscador y nadie se entera hasta que un alumno lo usa.
  - search
  # URLs viejas -> nuevas. Ver el porqué en requirements.txt. Cuando se mueva
  # una clase de lugar, agregar acá su ruta vieja: el costo es una línea y
  # evita romperle el link a alguien que lo tenía guardado.
  - redirects:
      redirect_maps:
        'clases/01_introduccion.md': 'clases/introduccion/01_introduccion.md'
        'clases/02_que_es_programar.md': 'clases/introduccion/02_que_es_programar.md'
