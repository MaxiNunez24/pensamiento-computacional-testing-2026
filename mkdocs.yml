        'clases/python/01_introduccion/archivos_python.md': 'clases/bloque_1_fundamentos/archivos_python.md'
        'clases/python/01_introduccion/ejecutar_programa.md': 'clases/bloque_1_fundamentos/ejecutar_programa.md'
        'clases/python/01_introduccion/historia_caracteristicas.md': 'clases/bloque_1_fundamentos/historia_caracteristicas.md'
        'clases/python/02_variables_y_tipos/formato_strings.md': 'clases/bloque_1_fundamentos/formato_strings.md'
