site_name: Pensamiento Computacional y Testing de Aplicaciones 2026
site_url: https://maxinunez24.github.io/pensamiento-computacional-testing-2026/
site_author: Maximiliano Nuñez

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/clases-restantes.js

theme:
  name: material
  favicon: assets/images/favicon.ico
  logo: assets/images/favicon.ico
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

  features:
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: 
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets



