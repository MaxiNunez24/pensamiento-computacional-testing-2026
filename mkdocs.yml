nav:
  - 🏠​ Inicio: index.md
  - 📅 Cronograma del curso: cronograma.md
  # Sitio hermano: la plataforma interactiva (Astro), publicada en /ejercicios/
  # del mismo GitHub Pages. Va como link absoluto porque no es una página de MkDocs.
  - 🧪 Ejercicios interactivos: https://maxinunez24.github.io/pensamiento-computacional-testing-2026/ejercicios/
  - 📚 Clases: 
    - 📝 Índice: clases/clases.md
    - 🧑‍🏫 Introducción: clases/introduccion/01_introduccion.md
    - 🧑‍💻 ¿Qué es programar?: clases/introduccion/02_que_es_programar.md
    - 🐍 Python Básico:
      - 🔰 Introducción:
        - 📜 Historía y características: clases/bloque_1_fundamentos/historia_caracteristicas.md
        - 📁 Archivos de Python: clases/bloque_1_fundamentos/archivos_python.md
        - ▶️ Ejecutar el programa: clases/bloque_1_fundamentos/ejecutar_programa.md
      - 💽​ Instalación:
        - 💻 Instalando las herramientas: clases/bloque_1_fundamentos/instalacion_herramientas.md
        - 🐍 Instalando Python: clases/bloque_1_fundamentos/instalar_python.md
        - 🧑‍💻 Instalando VS Code: clases/bloque_1_fundamentos/instalar_vscode.md
      - 📊 Variables y Tipos:
        - 🖨️ La función print(): clases/bloque_1_fundamentos/funcion_print.md
        - 📊 Variables: clases/bloque_1_fundamentos/variables.md
        - 📐 Formato de strings: clases/bloque_1_fundamentos/formato_strings.md
        - ⌨️ La función input(): clases/bloque_1_fundamentos/funcion_input.md
      # ⚠️ El orden de acá abajo es el orden en que se enseña: Listas va ANTES
      # que Bucles (un `for` necesita algo que recorrer) y Funciones I antes que
      # Colecciones. Funciones II queda después de Colecciones a propósito:
      # explica `*args` como "una tupla" y `**kwargs` como "un diccionario".
      #
      # Las carpetas agrupan por BLOQUE, no por tema, justamente para que
      # reordenar sea gratis: el orden vive acá y nada más que acá. Mover una
      # clase de lugar en esta lista no renombra ni un archivo.
      - 🔀 Condicionales:
        - 🔀 If - Else: clases/bloque_1_fundamentos/if_else.md
      - 📋 Listas:
        - 📋 Listas en Python: clases/bloque_1_fundamentos/listas.md
      - 🔁 Bucles:
        - 🔄 While: clases/bloque_1_fundamentos/while.md
        - 🔁 For: clases/bloque_1_fundamentos/for.md
        - 🧮​ Ejercicios Estructuras de Control: clases/bloque_1_fundamentos/ejercicios_estructuras_control.md
      - 📒 Práctica de Listas:
        - 📒 Cuadernillo de ejercicios sobre Listas: clases/bloque_1_fundamentos/cuadernillo_listas_finde.md
        - 📝 Mini Parcial: clases/bloque_1_fundamentos/mini_parcial.md
      - 📦 Funciones I:
        - 📦 Funciones I: clases/bloque_2_funciones_y_colecciones/funciones_1.md
        - 🧠 Cómo encarar un ejercicio: clases/bloque_2_funciones_y_colecciones/como_encarar_ejercicios.md
        - "🔥 Entrada en calor: Funciones como caja negra": clases/bloque_2_funciones_y_colecciones/funciones_caja_negra.md
      - 🗂️ Colecciones:
        - 🎲 Tuplas y Sets: clases/bloque_2_funciones_y_colecciones/tuplas_sets.md
        - 🗝️ Diccionarios: clases/bloque_2_funciones_y_colecciones/diccionarios.md
      - 📦 Funciones II:
        - 📦 Funciones II: clases/bloque_2_funciones_y_colecciones/funciones_2.md
        - "📦 Anexo: Importar módulos": clases/bloque_2_funciones_y_colecciones/imports_y_modulos.md
      - 🧠 Práctica e integradores:
        - 🔁 Repaso general: clases/bloque_2_funciones_y_colecciones/repaso.md
        - 🔍 Lectura y corrección de código: clases/bloque_2_funciones_y_colecciones/lectura_codigo.md
        - 🧠 Del enunciado al programa: clases/bloque_2_funciones_y_colecciones/del_enunciado_al_programa.md
        - 🎲 Bingo: clases/bloque_2_funciones_y_colecciones/bingo.md
      - 💾 Persistencia:
        - 🐙 Git y GitHub: clases/bloque_3_persistencia/git_github.md
        - 📁 Archivos: clases/bloque_3_persistencia/archivos.md
        - 📄 JSON: clases/bloque_3_persistencia/json.md
      - 🏗️ POO:
