<!DOCTYPE html><html lang="es" data-theme="dark"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Tu foto con IA del stand de Pensamiento Computacional."><meta name="theme-color" content="#0d1017"><link rel="icon" href="/pensamiento-computacional-testing-2026/ejercicios/favicon.ico"><title>Tu foto · Expo CFP 401</title><script>
      // Antes de dibujar nada, así no parpadea en oscuro al cargar en claro
      (() => {
        const CLAVE = 'expo:tema';
        const aplicar = (tema) => { document.documentElement.dataset.tema = tema === 'claro' ? 'claro' : 'oscuro'; };
        try { aplicar(localStorage.getItem(CLAVE)); } catch { aplicar('oscuro'); }
        addEventListener('keydown', (e) => {
          if (!e.ctrlKey || !e.altKey || e.key.toLowerCase() !== 'o') return;
          e.preventDefault();
          e.stopImmediatePropagation(); // que no lo tome ningún atajo de la página
          const tema = document.documentElement.dataset.tema === 'claro' ? 'oscuro' : 'claro';
          aplicar(tema);
          try { localStorage.setItem(CLAVE, tema); } catch { /* sin guardar: igual cambia */ }
        }, true);
        addEventListener('storage', (e) => { if (e.key === CLAVE) aplicar(e.newValue); });
        // Las animaciones (<motor-escena>) toman el tema del sitio al armarse, pero no se enteran si
        // cambia después: cambie por donde cambie (atajo, botón, otra pestaña), se les pasa el nuevo
        const animaciones = () => {
          const tema = document.documentElement.dataset.tema === 'claro' ? 'claro' : 'oscuro';
          document.querySelectorAll('motor-escena').forEach((m) => { if (m.getAttribute('tema') !== tema) m.setAttribute('tema', tema); });
        };
        new MutationObserver(animaciones).observe(document.documentElement, { attributes: true, attributeFilter: ['data-tema'] });
        addEventListener('DOMContentLoaded', animaciones);
      })();
    </script><style>:root{color-scheme:dark;--fondo: #0d1017;--superficie: #161b25;--borde: #262e3d;--texto: #eef1f6;--suave: #a3adbd;--oro: #f2c14e;--menta: #4fd1b5;--coral: #ff7a6b;--radio: 18px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}html[data-tema=claro]{color-scheme:light;--fondo: #f3f5f8;--superficie: #ffffff;--borde: #cfd6e2;--texto: #10131a;--suave: #4a5466;--oro: #cf8a00;--menta: #0d8a6f;--coral: #c8402f}*,*:before,*:after{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--fondo);color:var(--texto);line-height:1.5;-webkit-font-smoothing:antialiased}a{color:var(--menta)}img,svg{max-width:100%}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
